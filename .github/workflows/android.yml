name: Build Android App

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Sync Capacitor Android
        run: npx cap sync android
        
      - name: Corrigir Gradle Wrapper
        working-directory: android
        run: |
          echo "=== Verificando Gradle Wrapper ==="

          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-)' gradle/wrapper/gradle-wrapper.properties)

          echo "Versão do Gradle: $GRADLE_VERSION"

          curl -fL \
            -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"

          echo "=== Verificando JAR ==="

          file gradle/wrapper/gradle-wrapper.jar

          jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null

          echo "Gradle Wrapper válido."
          
      - name: Verificar projeto Android
        run: |
          echo "=== Android ==="
          ls -la android

          echo "=== Gradle Wrapper ==="
          ls -la android/gradle/wrapper

          echo "=== Gradlew ==="
          ls -la android/gradlew

      - name: Dar permissão ao Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleReleas     
