name: Build Android App

on:
push:
branches:
- main
tags:
- "v*"
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java JDK 21
    uses: actions/setup-java@v5
    with:
      java-version: "21"
      distribution: zulu
      cache: gradle

  - name: Configurar Node.js
    uses: actions/setup-node@v5
    with:
      node-version: 24

  - name: Instalar dependências
    run: |
      rm -rf node_modules
      npm install

  - name: Instalar Capacitor Assets
    run: |
      npm install --save-dev @capacitor/assets

  - name: Validar imagens
    run: |
      echo "=== Verificando imagens ==="

      if [ ! -f "assets/icon.png" ]; then
        echo "ERRO: assets/icon.png não encontrado."
        exit 1
      fi

      if [ ! -f "assets/splash.png" ]; then
        echo "ERRO: assets/splash.png não encontrado."
        exit 1
      fi

      echo "=== Icon ==="
      file assets/icon.png

      echo "=== Splash ==="
      file assets/splash.png

  - name: Gerar recursos Android
    run: |
      echo "Gerando ícones e splash..."

      npx capacitor-assets generate

  - name: Build Web Application
    run: npm run build

  - name: Sync Capacitor Android
    run: npx cap sync android

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      validate-wrappers: false

  - name: Corrigir Gradle Wrapper
    working-directory: android
    run: |
      GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-)' gradle/wrapper/gradle-wrapper.properties)

      echo "Gradle version: $GRADLE_VERSION"

      curl -L -o gradle/wrapper/gradle-wrapper.jar \
        "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"

      file gradle/wrapper/gradle-wrapper.jar

  - name: Instalar Android SDK
    run: |
      echo "y" | sdkmanager \
        "platforms;android-36" \
        "build-tools;36.0.0"

  - name: Dar permissão ao Gradle
    working-directory: android
    run: chmod +x gradlew

  - name: Build APK Release
    working-directory: android
    run: ./gradlew assembleRelease

  - name: Assinar APK
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    run: |
      echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imobishare.keystore"

      "$ANDROID_HOME/build-tools/36.0.0/zipalign" \
        -f -p 4 \
        android/app/build/outputs/apk/release/app-release-unsigned.apk \
        "$RUNNER_TEMP/app-release-aligned.apk"

      "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
        --ks "$RUNNER_TEMP/imobishare.keystore" \
        --ks-key-alias "$ANDROID_KEY_ALIAS" \
        --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
        --key-pass "pass:$ANDROID_KEY_PASSWORD" \
        --out android/app/build/outputs/apk/release/imobishare-release.apk \
        "$RUNNER_TEMP/app-release-aligned.apk"

      "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
        android/app/build/outputs/apk/release/imobishare-release.apk

  - name: Publicar APK assinado
    uses: actions/upload-artifact@v4
    with:
      name: imobishare-release
      path: android/app/build/outputs/apk/release/imobishare-release.apk
      if-no-files-found: error
```
