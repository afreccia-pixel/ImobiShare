name: Build Android App

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "zulu"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Instalar dependências
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verificar Capacitor
        run: npx cap --version

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Limpar recursos antigos de splash e ícones
        run: |
          echo "🗑️ Limpando recursos Android antigos..."

          find android/app/src/main/res -type f \
            \( -name "splash.png" \
            -o -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png" \
            -o -name "ic_launcher_foreground.png" \) \
            -delete

          find android/app/src/main/res -type d \
            \( -name "drawable-port-*" \
            -o -name "drawable-land-*" \) \
            -empty -delete

          echo "✅ Recursos antigos removidos."
    
      - name: Limpar ícones Android antigos
        run: |
          echo "🗑️ Removendo ícones antigos..."

          find android/app/src/main/res -type f \
            \( -name "ic_launcher.png" \
            -o -name "ic_launcher_round.png" \
            -o -name "ic_launcher_foreground.png" \) \
            -delete

          echo "Ícones antigos removidos."

      - name: Instalar Capacitor Assets
        run: |
          npm install --save-dev @capacitor/assets

      - name: Validar imagens de origem
        run: |
          echo "=== Icon ==="
          file assets/icon.png

          echo "=== Splash ==="
          file assets/splash.png

          if [ ! -f "assets/icon.png" ]; then
            echo "❌ assets/icon.png não encontrado"
            exit 1
          fi

          if [ ! -f "assets/splash.png" ]; then
            echo "❌ assets/splash.png não encontrado"
            exit 1
          fi

      - name: Gerar ícones e splash
        run: |
          npx capacitor-assets generate
          
      - name: Garantir splash principal
        run: |
          echo "=== Garantindo drawable/splash.png ==="

          mkdir -p android/app/src/main/res/drawable

          if [ ! -f "assets/splash.png" ]; then
            echo "❌ assets/splash.png não encontrado."
            exit 1
          fi

          cp assets/splash.png android/app/src/main/res/drawable/splash.png

          echo "=== Validando splash ==="
          file android/app/src/main/res/drawable/splash.png

          if [ ! -s "android/app/src/main/res/drawable/splash.png" ]; then
            echo "❌ splash.png está vazio."
            exit 1
          fi

          echo "✅ drawable/splash.png criado."
          
      - name: Corrigir Gradle Wrapper
        working-directory: android
        run: |
          echo "=== Verificando Gradle Wrapper ==="

          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-)' gradle/wrapper/gradle-wrapper.properties)

          echo "Versão do Gradle: $GRADLE_VERSION"

          curl -fL \
            -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"

          echo "=== Verificando JAR ==="

          file gradle/wrapper/gradle-wrapper.jar

          jar tf gradle/wrapper/gradle-wrapper.jar > /dev/null

          echo "Gradle Wrapper válido."
          
      - name: Verificar projeto Android
        run: |
          echo "=== Android ==="
          ls -la android

          echo "=== Gradle Wrapper ==="
          ls -la android/gradle/wrapper

          echo "=== Gradlew ==="
          ls -la android/gradlew

      - name: Dar permissão ao Gradle
        working-directory: android
        run: chmod +x gradlew

      - name: Build APK Release
        working-directory: android
        run: ./gradlew assembleReleas     
