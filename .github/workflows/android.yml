name: Build Android App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: "[1/16] Checkout do código"
        uses: actions/checkout@v4

      - name: "[2/16] Setup Java JDK 21"
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: zulu
          cache: gradle

      - name: "[3/16] Configurar Node.js"
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: "[4/16] Instalar dependências Node"
        run: npm ci

      - name: "[5/16] Build da Aplicação Web"
        run: npm run build

      - name: "[6/16] Sincronizar Capacitor Android"
        run: npx cap sync android

      - name: "[7/16] Instalar ImageMagick"
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: "[8/16] Validar e Gerar Splash Screens"
        run: |
          echo "🎨 Preparando imagem base do splash..."
          SRC_IMG=""

          if [ -f "assets/splash.png" ]; then
            echo "🔍 Verificando fonte principal: assets/splash.png..."
            file assets/splash.png || true
            if ! identify assets/splash.png; then
              echo "❌ ERRO: assets/splash.png não é um PNG válido."
              exit 1
            fi
            SRC_IMG="assets/splash.png"
            echo "Usando splash principal: assets/splash.png"
          else
            echo "⚠️ assets/splash.png não foi encontrado. Procurando fallback válido..."
            CANDIDATES=(
              "public/splash.png"
              "src/assets/images/splash.png"
              "public/icon-512.png"
              "public/app_icon.png"
              "src/assets/images/app_icon_1785762115971.jpg"
              "src/assets/images/imobishare_logo_1784239677798.jpg"
            )
            for cand in "${CANDIDATES[@]}"; do
              if [ -f "$cand" ]; then
                echo "🔍 Verificando candidato: $cand"
                file "$cand" || true
                if identify "$cand" >/dev/null 2>&1; then
                  SRC_IMG="$cand"
                  break
                else
                  echo "⚠️ Candidato $cand não é uma imagem válida. Ignorando..."
                fi
              fi
            done
          fi

          if [ -n "$SRC_IMG" ]; then
            echo "Imagem selecionada para splash: $SRC_IMG"
            echo "Gerando splash a partir de: $SRC_IMG"
            convert "$SRC_IMG" -strip -alpha off PNG24:/tmp/splash.png
          else
            echo "Nenhuma imagem de origem válida encontrada. Gerando splash padrão ImobiShare."
            convert -size 1024x1024 xc:"#003366" \
              -pointsize 120 -fill white -gravity center -annotate +0+0 "ImobiShare" \
              -alpha off PNG24:/tmp/splash.png
          fi

          echo "🗑️ Deletando splash antigos..."
          find android/app/src/main/res/drawable-* -name "splash.png" -delete 2>/dev/null || true

          declare -A PORT_SIZES=(
            [mdpi]="320x480"
            [hdpi]="480x800"
            [xhdpi]="800x1280"
            [xxhdpi]="1080x1920"
            [xxxhdpi]="1440x2560"
          )

          declare -A LAND_SIZES=(
            [mdpi]="480x320"
            [hdpi]="800x480"
            [xhdpi]="1280x800"
            [xxhdpi]="1920x1080"
            [xxxhdpi]="2560x1440"
          )

          for density in "${!PORT_SIZES[@]}"; do
            mkdir -p "android/app/src/main/res/drawable-port-$density"
            mkdir -p "android/app/src/main/res/drawable-land-$density"
            convert /tmp/splash.png -resize "${PORT_SIZES[$density]}!" \
              -alpha off PNG24:"android/app/src/main/res/drawable-port-$density/splash.png"
            convert /tmp/splash.png -resize "${LAND_SIZES[$density]}!" \
              -alpha off PNG24:"android/app/src/main/res/drawable-land-$density/splash.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cp /tmp/splash.png android/app/src/main/res/drawable/splash.png

      - name: "[9/16] Validar e Gerar Ícones do App"
        run: |
          echo "🎨 Preparando imagem base do ícone..."
          SRC_ICON=""

          if [ -f "assets/icon.png" ]; then
            echo "🔍 Verificando fonte principal: assets/icon.png..."
            file assets/icon.png || true
            if ! identify assets/icon.png; then
              echo "❌ ERRO: assets/icon.png não é um PNG válido."
              exit 1
            fi
            SRC_ICON="assets/icon.png"
            echo "Usando ícone principal: assets/icon.png"
          else
            echo "⚠️ assets/icon.png não foi encontrado. Procurando fallback válido..."
            CANDIDATES=(
              "public/icon.png"
              "public/icon-512.png"
              "public/app_icon.png"
              "src/assets/images/app_icon_1785762115971.jpg"
              "src/assets/images/imobishare_logo_1784239677798.jpg"
            )
            for cand in "${CANDIDATES[@]}"; do
              if [ -f "$cand" ]; then
                echo "🔍 Verificando candidato: $cand"
                file "$cand" || true
                if identify "$cand" >/dev/null 2>&1; then
                  SRC_ICON="$cand"
                  break
                else
                  echo "⚠️ Candidato $cand não é uma imagem válida. Ignorando..."
                fi
              fi
            done
          fi

          if [ -n "$SRC_ICON" ]; then
            echo "Imagem selecionada para ícone: $SRC_ICON"
            echo "Gerando ícone a partir de: $SRC_ICON"
            convert "$SRC_ICON" -strip PNG32:/tmp/ic_launcher.png
          else
            echo "Nenhuma imagem de origem encontrada. Gerando ícone padrão ImobiShare."
            convert -size 512x512 xc:"#003366" \
              -pointsize 80 -fill white -gravity center -annotate +0+0 "ImobiShare" \
              PNG32:/tmp/ic_launcher.png
          fi

          find android/app/src/main/res/mipmap-* -name "ic_launcher*.png" -delete 2>/dev/null || true
          mkdir -p android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}

          declare -A SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!SIZES[@]}"; do
            size=${SIZES[$density]}
            dir="android/app/src/main/res/mipmap-$density"

            for icon_name in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert /tmp/ic_launcher.png -resize "${size}x${size}" \
                PNG32:"$dir/$icon_name.png"
            done
          done

      - name: "[10/16] Configurar Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: "[11/16] Corrigir Gradle Wrapper"
        working-directory: android
        run: |
          GRADLE_VERSION=$(grep -oP '(?<=gradle-)[0-9]+\.[0-9]+(\.[0-9]+)?(?=-)' gradle/wrapper/gradle-wrapper.properties)
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"
          file gradle/wrapper/gradle-wrapper.jar

      - name: "[12/16] Instalar Android SDK 36 e Build Tools 36"
        run: |
          echo "y" | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" || \
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: "[13/16] Permissão de execução ao gradlew"
        working-directory: android
        run: chmod +x gradlew

      - name: "[14/16] Build do APK de release"
        working-directory: android
        run: ./gradlew assembleRelease

      - name: "[15/16] Assinar APK de release"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING" = "true" ]; then
            echo "🔑 Chave de assinatura configurada. Assinando APK de release..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/imobishare.keystore"

            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 \
              android/app/build/outputs/apk/release/app-release-unsigned.apk \
              "$RUNNER_TEMP/app-release-aligned.apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/imobishare.keystore" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out android/app/build/outputs/apk/release/imobishare-release.apk \
              "$RUNNER_TEMP/app-release-aligned.apk"

            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
              android/app/build/outputs/apk/release/imobishare-release.apk
            echo "✅ APK assinado e verificado com sucesso!"
          else
            echo "⚠️ Chave de assinatura não configurada (secrets.ANDROID_KEYSTORE_BASE64 ausente)."
            echo "O APK gerado não será assinado e será disponibilizado como imobishare-release.apk."
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
               android/app/build/outputs/apk/release/imobishare-release.apk
          fi

      - name: "[16/16] Publicar APK Release (Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: imobishare-release
          path: android/app/build/outputs/apk/release/imobishare-release.apk
          if-no-files-found: error
