name: Build Android App

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build Android
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      java-version: "21"
      distribution: "zulu"

  - name: Setup Node
    uses: actions/setup-node@v5
    with:
      node-version: "24"

  - name: Install dependencies
    run: npm install

  - name: Build Web
    run: npm run build
```
